name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect backend
        id: detect
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pyproject.toml yet, skipping backend checks"
          fi

      - name: Install uv
        if: steps.detect.outputs.present == 'true'
        run: pipx install uv

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: uv sync --locked

      - name: Ruff lint
        if: steps.detect.outputs.present == 'true'
        run: uv run ruff check --output-format github .

      - name: Ruff format
        if: steps.detect.outputs.present == 'true'
        run: uv run ruff format --check .

      - name: Mypy
        if: steps.detect.outputs.present == 'true'
        run: uv run mypy

      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No frontend/package.json yet, skipping frontend checks"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: ESLint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type check
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
