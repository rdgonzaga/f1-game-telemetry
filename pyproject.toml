[project]
name = "f1-game-telemetry"
version = "0.0.0"
description = "Localhost telemetry dashboard for F1 25 and the 2026 Season Pack"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
f1telemetry = "f1telemetry.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "f1telemetry"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["bench_parse", "f1telemetry", "inspect_raw", "trim_raw"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["f1telemetry", "tools", "tests"]
mypy_path = "tools"
