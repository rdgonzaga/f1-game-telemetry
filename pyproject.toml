[project]
name = "f1-game-telemetry"
version = "0.0.0"
description = "Localhost telemetry dashboard for F1 25 and the 2026 Season Pack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["f1telemetry", "inspect_raw", "record_raw", "replay_raw", "trim_raw"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["f1telemetry", "tools", "tests"]
mypy_path = "tools"
